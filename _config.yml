# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Cellotrion
email: biljetter@cellotrion.se
description: >- # this means to ignore newlines until "baseurl:"
  Cellotrion är en cellotrio i Linköping som ger varma och nära konserter med klassisk musik – från Bach och Chopin till Piazzolla. Fika ingår.
url: "https://cellotrion.se" # bas-URL för canonical, sitemap, og:url och RSS
baseurl: "" # sajten ligger i roten av domänen
repository: "teyrow/cellotrion.se"
og_image: /assets/images/cellotrion.jpeg # bild som visas när sidan delas
social:
  type: Organization # måste vara exakt "Organization" för att temat ska generera rätt schema.org-data
  name: Cellotrion
  links:
    - "https://www.facebook.com/Cellotrion/"
    - "https://www.instagram.com/cellotrion/"
minimal_mistakes_skin: neon
search: true

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
# Outputting
# Kategorierna ingår medvetet inte i adressen: en konsert som byter kategori
# (t.ex. tappar "kommande") skulle annars få en ny URL och tappa sina länkar.
permalink: /:title/
timezone: EUROPE/STOCKHOLM # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
locale: sv-SE

include:
  - _pages

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
# exclude:
#   - Gemfile
#   - Gemfile.lock
#   - node_modules
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jekyll-redirect-from
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

author:
  name   : "Cellotrion"
  avatar : "/assets/images/cellortrio-photo.jpg"
  bio    : "Vi har plockat fram essensen i skön musik och består av endast cellister. Upplevelsen kröner vi gärna med fika. Hoppas vi ses!"

footer:
  links:
    - label: "Facebook"
      icon: "fab fa-fw fa-square-facebook"
      url: "https://www.facebook.com/Cellotrion/"
    - label: "Instagram"
      icon: "fab fa-fw fa-instagram"
      url: "https://www.instagram.com/cellotrion"
    - label: "E-post info@cellotrion.se"
      icon: "fa fa-fw fa-envelope"
      url: "mailto:info@cellotrion.se"
    - label: "Telefon"
      icon: "fa fa-fw fa-phone"
      url: "tel:0730-360396"

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: false
      read_time: false
      comments: false
      share: false
      related: false
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: false

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
